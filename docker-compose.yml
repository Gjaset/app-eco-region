services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"
    command: ["gotenberg", "--chromium-disable-javascript=false"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:///./data/ecoregion.db
      DATA_PATH: /app/data
      TEMPLATES_PATH: /app/templates
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "8001:8001"
    depends_on:
      gotenberg:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./backend/templates:/app/templates
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/app

  frontend:
    build: ./frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174

volumes:
  frontend_node_modules:
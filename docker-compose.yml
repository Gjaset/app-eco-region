services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoregion_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecoregion_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    command: ["gotenberg", "--chromium-disable-javascript=false"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/ecoregion_db
      DATA_PATH: /app/data
      TEMPLATES_PATH: /app/templates
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./backend/templates:/app/templates
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
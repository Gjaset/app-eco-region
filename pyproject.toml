[project]
name = "ecoregionapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "docxtpl==0.18.0",
    "email-validator==2.2.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "mangum==0.19.0",
    "psycopg2-binary==2.9.10",
    "pwdlib[argon2]==0.2.1",
    "pydantic==2.9.0",
    "pyjwt==2.10.1",
    "pypdf>=6.18.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "rapidfuzz==3.10.0",
    "reportlab>=5.0.1",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.32.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
